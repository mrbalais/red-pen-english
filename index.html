<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Red Pen English</title>
<meta name="description" content="Ton coach d'anglais : conversation, dictée, exercices, articles et carnet d'erreurs.">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E121B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one notebook column (max 900px). Desktop: tabs under the header. Phone: app-style bottom bar. Tutor in ballpoint blue, corrections in red pen, XP in gold, streak in flame orange. */
:root{
  --paper:#F2F4F8; --sheet:#FFFFFF; --ink:#18203A; --muted:#5B6480; --line:#DCE1EB; --rule:#E9EDF5;
  --pen:#C42F25; --pen-soft:rgba(196,47,37,.09); --biro:#2A46B5; --biro-soft:rgba(42,70,181,.09); --on-biro:#FFFFFF;
  --hl:#F6E88A; --ok:#1E7A4C; --ok-soft:rgba(30,122,76,.10); --gold:#A86A00; --gold-soft:rgba(214,152,20,.16); --flame:#DB5A14;
  --h1:rgba(42,70,181,.18); --h2:rgba(42,70,181,.38); --h3:rgba(42,70,181,.62); --h4:#2A46B5;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-hand:"Kalam", "Segoe Print", "Bradley Hand", cursive;
  --r:12px; --navh:0px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E121B; --sheet:#151A26; --ink:#E6E9F2; --muted:#98A1B7; --line:#273047; --rule:#1D2333;
    --pen:#FF7466; --pen-soft:rgba(255,116,102,.13); --biro:#93A8FF; --biro-soft:rgba(147,168,255,.14); --on-biro:#0E121B;
    --hl:rgba(236,210,90,.30); --ok:#5FD39C; --ok-soft:rgba(95,211,156,.13); --gold:#F2C14E; --gold-soft:rgba(242,193,78,.16); --flame:#FF8A3D;
    --h1:rgba(147,168,255,.18); --h2:rgba(147,168,255,.36); --h3:rgba(147,168,255,.6); --h4:#93A8FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E121B; --sheet:#151A26; --ink:#E6E9F2; --muted:#98A1B7; --line:#273047; --rule:#1D2333;
  --pen:#FF7466; --pen-soft:rgba(255,116,102,.13); --biro:#93A8FF; --biro-soft:rgba(147,168,255,.14); --on-biro:#0E121B;
  --hl:rgba(236,210,90,.30); --ok:#5FD39C; --ok-soft:rgba(95,211,156,.13); --gold:#F2C14E; --gold-soft:rgba(242,193,78,.16); --flame:#FF8A3D;
  --h1:rgba(147,168,255,.18); --h2:rgba(147,168,255,.36); --h3:rgba(147,168,255,.6); --h4:#93A8FF; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:1.6rem} h3{font-size:1.15rem}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--biro);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.45rem;font-weight:600;position:relative;white-space:nowrap}
.brand em{font-style:italic;color:var(--pen);font-weight:400}
.brand svg{position:absolute;left:0;bottom:-6px;width:58px;height:8px}
.hstats{display:flex;gap:12px;align-items:center;font-size:.85rem;flex-wrap:wrap}
.hstats .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:3px 10px 3px 4px;font-weight:600}
.hstats .lv{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--sheet);font-size:.78rem;font-weight:700}
.hstats .xpbar{width:70px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.hstats .xpbar i{display:block;height:100%;background:var(--gold)}
.hstats svg{width:16px;height:16px}
.flame{color:var(--flame)}
nav.tabs{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;padding:9px 4px 10px;font-size:.88rem;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;position:relative}
nav.tabs button svg{width:18px;height:18px;flex:none}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pen);font-weight:600}
nav.tabs .n{position:absolute;top:3px;right:8%;min-width:17px;padding:0 4px;border-radius:9px;background:var(--pen);color:var(--sheet);font-size:.68rem;font-weight:700;line-height:17px;text-align:center}

/* generic */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--biro);border-color:var(--biro);color:var(--on-biro)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.pen{color:var(--pen);border-color:var(--pen)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--sheet);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.big{padding:12px 20px;font-size:1rem}
.btn:disabled{opacity:.5;cursor:default}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.notice{font-size:.85rem;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px}
.hand{font-family:var(--f-hand);color:var(--pen)}
mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:2px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 12px;resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--biro);outline:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--sheet);padding:6px 12px;cursor:pointer;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--biro);border-radius:3px}
.bar.gold i{background:var(--gold)} .bar.ok i{background:var(--ok)} .bar.pen i{background:var(--pen)}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);white-space:nowrap}
.xptag{font-size:.75rem;font-weight:700;color:var(--gold);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--navh) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:999px;font-size:.88rem;z-index:30;max-width:calc(100vw - 32px);text-align:center}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.hidden{display:none!important}

/* game feedback */
@keyframes rise{0%{transform:translateY(8px);opacity:0}15%{opacity:1}100%{transform:translateY(-36px);opacity:0}}
.xpf{position:fixed;right:20px;top:calc(70px + env(safe-area-inset-top,0px));z-index:31;font-weight:700;color:var(--gold);font-size:1.05rem;pointer-events:none;animation:rise 1.4s ease-out forwards;text-shadow:0 1px 0 var(--sheet)}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(2.2);opacity:0}25%{transform:translate(-50%,-50%) rotate(-8deg) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) rotate(-8deg) scale(1);opacity:0}}
.stamp{position:fixed;left:50%;top:42%;z-index:32;pointer-events:none;font-family:var(--f-display);font-weight:600;font-size:clamp(1.8rem,7vw,3rem);color:var(--pen);border:4px solid var(--pen);border-radius:10px;padding:6px 22px;background:var(--sheet);text-align:center;line-height:1.1;animation:stamp 1.6s ease-out forwards;max-width:calc(100vw - 40px)}
.stamp small{display:block;font-family:var(--f-body);font-size:.9rem;font-weight:600;color:var(--ink);letter-spacing:.04em}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:29}
.modal{position:fixed;inset:0;z-index:33;background:rgba(10,14,24,.55);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--sheet);border-radius:16px;padding:26px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;border:1px solid var(--line)}
.modal .big{font-family:var(--f-display);font-size:3.2rem;font-weight:600;color:var(--gold);line-height:1}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}.xpf{animation-duration:2s}.stamp{animation:none;transform:translate(-50%,-50%) rotate(-8deg)}}

/* home */
.hello{display:flex;flex-direction:column;gap:4px}
.hello h2{font-size:1.85rem}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kpi{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;min-width:0}
.kpi .ring{width:64px;height:64px;flex:none;position:relative}
.kpi .ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.kpi .ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:1.45rem;font-weight:600}
.kpi .trk{fill:none;stroke:var(--line);stroke-width:7}
.kpi .val{fill:none;stroke-width:7;stroke-linecap:round}
.kpi .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .tx strong{font-size:.98rem}
.kpi .tx span{font-size:.8rem;color:var(--muted)}
.kpi .flamebig{width:64px;height:64px;flex:none;display:grid;place-items:center;position:relative}
.kpi .flamebig svg{width:52px;height:52px}
.kpi .flamebig b{position:absolute;bottom:4px;font-family:var(--f-display);font-size:1.25rem;color:var(--ink);background:var(--sheet);border-radius:8px;padding:0 5px;line-height:1.2}
.kpi .flamebig.off svg{opacity:.3}
.jok{display:inline-flex;gap:3px;vertical-align:middle}
.jok i{width:10px;height:10px;border-radius:3px;border:1.5px solid var(--biro)}
.jok i.on{background:var(--biro)}
.quests{display:flex;flex-direction:column;gap:12px}
.quest{display:grid;grid-template-columns:26px 1fr auto;gap:4px 12px;align-items:center}
.quest .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.quest.done .ck{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.quest.done .qt{color:var(--muted);text-decoration:line-through}
.quest .bar{grid-column:2/4}
.quest .p{font-size:.78rem;color:var(--muted)}
.chest{display:flex;gap:14px;align-items:center;border:1px dashed var(--gold);border-radius:var(--r);padding:12px 14px;background:var(--gold-soft)}
.chest svg{width:36px;height:36px;flex:none;color:var(--gold)}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.block{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.block .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.block .mins{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--muted);white-space:nowrap}
.block.done .bar i{background:var(--ok)}
.block p{font-size:.84rem;color:var(--muted);flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.track{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.track span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.track span i{display:block;width:100%;height:8px;border-radius:4px;background:var(--line)}
.track span.past i{background:var(--biro)}
.track span.cur i{background:linear-gradient(90deg,var(--biro) var(--p),var(--line) var(--p))}
.track span.cur{color:var(--ink);font-weight:700}
.league .lr{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;font-size:.88rem}
.league .lr.me{background:var(--gold-soft);font-weight:600}
.league .lr .rk{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.league .lr.up .rk{color:var(--ok)} .league .lr.down .rk{color:var(--pen)}
.league .lr b{font-variant-numeric:tabular-nums}
.weak{display:flex;flex-direction:column;gap:9px}
.weak .w{display:grid;grid-template-columns:150px 1fr 28px;gap:10px;align-items:center;font-size:.86rem}
.weak .w .t{height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.weak .w .t i{display:block;height:100%;background:var(--pen)}
.weak .w b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;max-width:340px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--rule);max-width:100%}
.heat i.h1{background:var(--h1)}.heat i.h2{background:var(--h2)}.heat i.h3{background:var(--h3)}.heat i.h4{background:var(--h4)}
.heat i.fr{outline:1.5px solid var(--biro);outline-offset:-1.5px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 6px;border-radius:10px;border:1px solid var(--line)}
.badge svg{width:34px;height:34px;color:var(--gold)}
.badge b{font-size:.8rem}
.badge span{font-size:.72rem;color:var(--muted)}
.badge.locked svg{color:var(--line)}
.badge.locked b{color:var(--muted)}
.sess{display:flex;flex-direction:column;gap:10px}
.sess .s{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.86rem;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.sess .s:last-child{border-bottom:0;padding-bottom:0}
.copy{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copy code{font-size:.82rem;background:var(--rule);padding:4px 8px;border-radius:6px;overflow-wrap:anywhere;user-select:all}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.88rem}

/* talk */
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.scen button{text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.scen button:hover{border-color:var(--biro)}
.scen button b{font-family:var(--f-display);font-size:1.1rem;font-weight:600}
.scen button span{font-size:.86rem;color:var(--muted)}
.talk-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.log{display:flex;flex-direction:column;gap:16px;padding:20px 18px 20px 30px;position:relative;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px)}
.log::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:1px;background:var(--pen);opacity:.35}
.msg{max-width:88%;display:flex;flex-direction:column;gap:6px;min-width:0}
.msg .txt{padding:10px 14px;border-radius:14px;overflow-wrap:anywhere}
.msg.ai{align-self:flex-start}
.msg.ai .txt{background:var(--biro-soft);color:var(--ink);border-top-left-radius:4px}
.msg.ai .who{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--biro);font-weight:600;display:flex;align-items:center;gap:8px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .txt{background:var(--sheet);border:1px solid var(--line);border-top-right-radius:4px}
.msg.me u{text-decoration:underline wavy var(--pen);text-underline-offset:3px}
.spk{border:0;background:none;color:var(--biro);cursor:pointer;padding:2px;display:inline-flex}
.spk svg{width:16px;height:16px}
.corr{font-size:.88rem;max-width:100%;display:flex;flex-direction:column;gap:4px;text-align:left;align-self:stretch;padding-left:6px}
.corr .e{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.corr s{color:var(--muted);text-decoration-color:var(--pen);text-decoration-thickness:2px}
.corr .fix{font-family:var(--f-hand);color:var(--pen);font-size:1.05rem}
.corr .why{color:var(--muted);font-size:.84rem;width:100%}
.corr .ok{font-family:var(--f-hand);color:var(--ok);font-size:1.05rem}
.corr .full{font-family:var(--f-hand);color:var(--pen);font-size:1rem}
.wordchips{display:flex;flex-wrap:wrap;gap:6px}
.wordchips span{font-size:.8rem;background:var(--hl);padding:2px 8px;border-radius:4px}
.err{font-size:.85rem;color:var(--pen);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.report{align-self:stretch;border:1px solid var(--pen);border-radius:var(--r);padding:16px;background:var(--sheet);display:flex;flex-direction:column;gap:10px}
.report h3{color:var(--pen)}
.report ul{margin:0;padding-left:18px}
.composer{position:sticky;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));background:var(--paper);padding-block:10px 6px;display:flex;flex-direction:column;gap:8px;z-index:4}
.composer .line{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px;max-height:200px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px dashed var(--biro);background:var(--sheet);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:.85rem;cursor:pointer;text-align:left}
.cleanrun{font-size:.8rem;font-weight:600;color:var(--ok)}

/* review */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px;min-height:240px}
.card .q{font-family:var(--f-display);font-size:1.35rem;line-height:1.4}
.card .q u{text-decoration:underline wavy var(--pen);text-underline-offset:4px}
.card .ans{font-family:var(--f-hand);color:var(--pen);font-size:1.3rem}
.combo{font-weight:700;color:var(--flame);font-size:.9rem;display:inline-flex;align-items:center;gap:4px}
.combo svg{width:16px;height:16px}
.list{display:flex;flex-direction:column}
.list .it{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:start}
.list .it:last-child{border-bottom:0}
.list .it .c{min-width:0;overflow-wrap:anywhere}
.list .it s{color:var(--muted);text-decoration-color:var(--pen)}

const Store = {
  db:null, uid:null, chains:{},
  q(key, fn){ this.chains[key] = (this.chains[key]||Promise.resolve()).then(fn).catch(e=>{ console.warn(e); if(e && e.code==="quota_exceeded") toast("Ton carnet est plein : supprime quelques fiches."); }); return this.chains[key]; },

  putCourse(c){ if(this.db){ const body = JSON.parse(JSON.stringify(c)); this.q("cr:"+c.id, ()=>this.coursesCol().doc(c.id).set(body)); } else this.local(); },
  delCourse(id){ if(this.db) this.q("cr:"+id, ()=>this.coursesCol().doc(id).delete()); else this.local(); },

function migrate(){
  if(typeof P.dlv !== "number"){ const i = LV.indexOf(P.level); P.dlv = i>=0 ? i : 2; }
  if(typeof P.dp !== "number") P.dp = 30;
  for(const k of ["xpDays","badges","totals","frozen","jokerDays","boss","days","voice"]) if(!P[k] || typeof P[k]!=="object") P[k] = {};
  if(!Array.isArray(P.sessions)) P.sessions = [];
  P.voice = Object.assign({accent:"en-GB",rate:0.95,auto:false}, P.voice);
  if(typeof P.sound !== "boolean") P.sound = true;
  P.xp = Number(P.xp)||0;
  if(RD && Array.isArray(RD.answers)) RD = { theme:"Marché de l’art", custom:"", len:"mid", mission:"sum", data:null, ans:{qa:["","",""],sum:"",eli:"",opinion:""}, fb:{}, wordsAdded:false };
}

/* ================= game engine ================= */
function levelInfo(xp){ let L = 1, need = 100, rest = Math.max(0, xp||0); while(rest >= need){ rest -= need; L++; need = 100 + 40*(L-1); } return {L, cur:rest, need}; }
const titleFor = L => { let t = TITLES[0][1]; for(const [n,s] of TITLES) if(L>=n) t = s; return t; };
function T(){ if(!P.today || P.today.d !== dkey()) P.today = {d:dkey(), claimed:{}, chest:null, goalDone:false}; return P.today; }
function todayQuests(){ const r = rng(hash("q"+dkey())); const pool = QUESTS.slice(); for(let i=pool.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [pool[i],pool[j]] = [pool[j],pool[i]]; } return pool.slice(0,3); }
const questProg = q => q.id==="min" ? dayMin(dkey()) : (T()[q.id]||0);
let checkPending = false;
function scheduleCheck(){ if(checkPending) return; checkPending = true; setTimeout(()=>{ checkPending = false; checkProgress(); }, 0); }
function gain(n, quiet){
  n = Math.round(n); if(!n) return;
  const before = levelInfo(P.xp).L;
  P.xp += n; const k = dkey(); P.xpDays[k] = (P.xpDays[k]||0) + n;
  const ks = Object.keys(P.xpDays).sort(); while(ks.length>120) delete P.xpDays[ks.shift()];
  if(!quiet) floatXP("+"+n+" XP");
  const after = levelInfo(P.xp).L;
  if(after > before) celebrate(after);
  Store.saveProfile(); renderStats(); scheduleCheck();
}
function bump(k, n=1, isMax=false){
  const t = T();
  if(isMax){ t[k] = Math.max(t[k]||0, n); }
  else { t[k] = (t[k]||0) + n; P.totals[k] = (P.totals[k]||0) + n; }
  Store.saveProfile(); scheduleCheck();
}
function checkProgress(){
  if(!S.loaded) return;
  jokerCheck();
  let changed = false; const t = T();
  for(const q of todayQuests()){
    if(!t.claimed[q.id] && questProg(q) >= q.g){ t.claimed[q.id] = 1; changed = true; snd("coin"); stamp("Quête réussie", q.t); gain(q.xp); }
  }
  const st = streak(); if(st > (P.bestStreak||0)){ P.bestStreak = st; changed = true; }
  for(const b of BADGES){
    let ok = false; try { ok = b.ok(); } catch {}
    if(!P.badges[b.id] && ok){ P.badges[b.id] = Date.now(); changed = true; snd("up"); toast("Badge débloqué : "+b.t); gain(25, true); }
  }
  if(changed){ Store.saveProfile(); if(S.tab==="today") renderToday(); }
  renderStats();
}
function adapt(score, w=1){
  if(P.lock) return;
  P.dp = (typeof P.dp==="number" ? P.dp : 30) + (score - 0.72) * 20 * w;
  if(P.dp >= 100){ if(P.dlv < 8){ P.dlv++; P.dp = 15; stamp("Niveau "+lvName(), "Le contenu devient plus difficile"); snd("up"); confetti(); } else P.dp = 100; }
  else if(P.dp < 0){ if(P.dlv > 0){ P.dlv--; P.dp = 65; toast("Difficulté ajustée à "+lvName()+" pour consolider les bases."); } else P.dp = 0; }
  P.level = LV[P.dlv].replace("+","");
  Store.saveProfile(); scheduleCheck();
}
/* streak, jokers */
function dayMin(k){ const r = P.days[k]||{}; return Math.floor(Object.values(r).reduce((a,b)=>a+(Number(b)||0),0)/60); }
const active = k => (P.xpDays[k]||0) >= 10 || dayMin(k) >= 10 || !!P.frozen[k];
function streakFrom(d){ let n = 0; const x = new Date(d); while(active(dkey(x))){ n++; x.setDate(x.getDate()-1); } return n; }
function streak(){ const today = dkey(); return active(today) ? streakFrom(new Date()) : streakFrom(dayOff(-1)); }
function freezeCheck(){
  const today = dkey(); if(P.freezeCheck === today) return; P.freezeCheck = today;
  const y = dkey(dayOff(-1));
  if(!active(y) && (P.jokers||0) > 0 && streakFrom(dayOff(-2)) > 0){ P.jokers--; P.frozen[y] = 1; toast("Un joker a protégé ta série hier."); }
  const fk = Object.keys(P.frozen).sort(); while(fk.length>40) delete P.frozen[fk.shift()];
  Store.saveProfile();
}
function jokerCheck(){
  const k = dkey(); if(P.jokerDays[k] || !active(k)) return;
  P.jokerDays[k] = 1; const jk = Object.keys(P.jokerDays).sort(); while(jk.length>40) delete P.jokerDays[jk.shift()];
  const st = streak();
  if(st > 0 && st % 7 === 0 && (P.jokers||0) < 2){ P.jokers = (P.jokers||0) + 1; stamp("Joker gagné", st+" jours d’affilée"); snd("coin"); }
  Store.saveProfile();
}
/* league */
function weekStart(d=new Date()){ const x = new Date(d); x.setHours(0,0,0,0); const wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
const weekKey = d => dkey(weekStart(d));
function weekXP(wk){ const s = new Date(wk+"T00:00:00"); let n = 0; for(let i=0;i<7;i++){ const x = new Date(s); x.setDate(s.getDate()+i); n += P.xpDays[dkey(x)]||0; } return n; }
function rivals(wk, tier, frac){
  const r = rng(hash(wk+":"+tier)); const names = RIVALS.slice(); const out = [];
  const base = 260 + tier*220;
  for(let i=0;i<5;i++){ const j = Math.floor(r()*names.length); const name = names.splice(j,1)[0]; const target = base*(0.5 + r()*1.1); out.push({name, xp:Math.round(target*Math.pow(Math.max(0,Math.min(1,frac)),0.9))}); }
  return out;
}
function leagueCheck(){
  const cw = weekKey();
  if(!P.league || !P.league.week){ P.league = {week:cw, tier:0}; Store.saveProfile(); return; }
  if(P.league.week === cw) return;
  const old = P.league.week, tier = P.league.tier||0, mine = weekXP(old);
  const rank = 1 + rivals(old, tier, 1).filter(x=>x.xp > mine).length;
  let to = tier; if(rank<=2 && tier<5) to++; else if(rank>=5 && tier>0) to--;
  P.league = {week:cw, tier:to, last:{rank, from:tier, to}};
  setTimeout(()=>{ if(to>tier){ stamp("Promotion !", "Ligue "+TIERS[to]); confetti(); snd("up"); } else if(to<tier) toast("Semaine finie à la "+rank+"e place : retour en ligue "+TIERS[to]+"."); else toast("Semaine finie à la "+rank+"e place en ligue "+TIERS[to]+"."); }, 800);
  Store.saveProfile();
}

/* ================= feedback fx ================= */
let AC;
function snd(kind){
  if(!P.sound) return;
  try {
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    const seq = {ok:[[660,.08],[880,.14]], bad:[[196,.2]], up:[[523,.1],[659,.1],[784,.1],[1047,.28]], coin:[[988,.07],[1319,.18]]}[kind]; if(!seq) return;
    let t = AC.currentTime;
    for(const [f,d] of seq){ const o = AC.createOscillator(), g = AC.createGain(); o.type = kind==="bad" ? "sawtooth" : "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(kind==="bad"?.06:.14,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.03); t += d*.9; }
  } catch {}
}
function floatXP(txt){ const el = document.createElement("div"); el.className = "xpf"; el.textContent = txt; $("#fx").appendChild(el); setTimeout(()=>el.remove(), 1500); }
function stamp(big, small){ const el = document.createElement("div"); el.className = "stamp"; el.innerHTML = esc(big) + (small?`<small>${esc(small)}</small>`:""); $("#fx").appendChild(el); setTimeout(()=>el.remove(), reduced?1400:1700); }
function confetti(){
  if(reduced) return;
  const cv = $("#confetti"); const ctx = cv.getContext("2d"); cv.classList.remove("hidden");
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cs = getComputedStyle(document.documentElement); const cols = ["--pen","--biro","--gold","--ok","--flame"].map(v=>cs.getPropertyValue(v).trim()||"#c42f25");
  const ps = Array.from({length:110}, () => ({x:W/2+(Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*9, vy:-Math.random()*9-3, s:4+Math.random()*5, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0 = performance.now();
  (function f(t){ ctx.clearRect(0,0,W,H); for(const p of ps){ p.vy += .25; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); }
    if(t - t0 < 2600) requestAnimationFrame(f); else { ctx.clearRect(0,0,W,H); cv.classList.add("hidden"); } })(t0);
}
function celebrate(L){
  snd("up"); confetti();
  const m = document.createElement("div"); m.className = "modal"; m.setAttribute("role","dialog");
  m.innerHTML = `<div class="box"><span class="label">Niveau supérieur</span><div class="big num">${L}</div><h3>${esc(titleFor(L))}</h3><p class="muted small">Prochain palier : ${levelInfo(P.xp).need} XP.</p><button class="btn primary" data-act="close-modal">Continuer</button></div>`;
  document.body.appendChild(m);
}

/* ================= cards ================= */
function addError(e, extra={}){
  const cat = CATS[e.cat] ? e.cat : "phrasing";
  if(!e.wrong || !e.right || norm(e.wrong)===norm(e.right)) return null;
  const ex = S.cards.find(c => c.kind==="error" && norm(c.wrong)===norm(e.wrong) && norm(c.right)===norm(e.right));
  const now = Date.now();
  if(ex){ ex.seen=(ex.seen||1)+1; ex.last=now; ex.box=0; ex.due=now; Store.putCard(ex); return ex; }
  const c = {id:uid(), kind:"error", wrong:String(e.wrong), right:String(e.right), why:String(e.why||""), cat, ctx:extra.ctx||"", src:extra.src||"conversation", created:now, last:now, seen:1, box:0, due:now, lapses:0};
  S.cards.push(c); Store.putCard(c); return c;
}
function addWord(w, src){
  if(!w || !w.en || !w.fr) return false;
  if(S.cards.find(c => c.kind==="word" && norm(c.en)===norm(w.en))) return false;
  const now = Date.now();
  const c = {id:uid(), kind:"word", en:String(w.en), fr:String(w.fr), example:String(w.example||""), src:src||"conversation", created:now, last:now, seen:1, box:0, due:now, lapses:0};
  S.cards.push(c); Store.putCard(c); return true;
}
function grade(c, ok){
  const now = Date.now();
  if(ok){ c.box = Math.min((c.box||0)+1, INTERVALS.length-1); c.due = sod(now) + INTERVALS[c.box]*DAY; }
  else { c.box = 0; c.due = now; c.lapses = (c.lapses||0)+1; c.last = now; }
  c.reps = (c.reps||0)+1; Store.putCard(c);
}
const dueCards = () => S.cards.filter(c => (c.due||0) <= Date.now()).sort((a,b)=>(a.due||0)-(b.due||0));
function weakCats(){
  const sc = {}; const now = Date.now();
  for(const c of S.cards){ if(c.kind!=="error") continue;
    const w = (c.seen||1) * ((now-(c.last||c.created)) < 14*DAY ? 1 : 0.5) + (c.lapses||0)*0.5;
    sc[c.cat] = (sc[c.cat]||0) + w; }
  return Object.entries(sc).sort((a,b)=>b[1]-a[1]);
}
function weakLine(){
  const w = weakCats().slice(0,3).map(([k])=>CATS_EN[k]);
  const rec = S.cards.filter(c=>c.kind==="error").sort((a,b)=>(b.last||0)-(a.last||0)).slice(0,8).map(c=>`"${c.wrong}" → "${c.right}"`);
  let s = ""; if(w.length) s += `His weak points: ${w.join(", ")}. `; if(rec.length) s += `Recent mistakes: ${rec.join("; ")}. `;
  const ct = S.courses.flatMap(c=>c.terms||[]).sort((a,b)=>(b.count||0)-(a.count||0)).slice(0,12).map(t=>t.en);
  if(ct.length) s += `Terms from his English courses, to reuse when it fits naturally: ${ct.join(", ")}.`;
  return s;
}

/* ================= speech ================= */
const canSpeak = "speechSynthesis" in window;
function pickVoice(){
  const vs = speechSynthesis.getVoices(); const lang = P.voice.accent;
  const m = vs.filter(v => v.lang && v.lang.replace("_","-").startsWith(lang));
  const pool = m.length ? m : vs.filter(v => v.lang && v.lang.startsWith("en"));
  return pool.find(v => /natural|premium|enhanced|google/i.test(v.name)) || pool[0] || null;
}
function speak(text, rate){
  if(!canSpeak) return toast("La lecture à voix haute n’est pas disponible sur ce navigateur.");
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\*\*/g,""));
    u.lang = P.voice.accent; u.rate = rate || P.voice.rate;
    const v = pickVoice(); if(v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e){ toast("Impossible de lire ce texte."); }
}

/* ================= TALK ================= */
function scen(){ return SCEN.find(s=>s.id===CHAT.scenario) || SCEN[0]; }
function rules(){
  const s = scen();
  return `You are a friendly English conversation partner for Noah, a French university student in law and art history (interests: the art market, intellectual property, digital law, environmental law, museums, Art Nouveau, design and architecture). His level is ${lvName()} on the CEFR scale: use ${lvDesc()}. ${weakLine()}
Scenario: ${s.p}
Rules:
- Speak natural ${P.voice.accent==="en-GB"?"British":"American"} English. Keep each reply short: 2 to 4 sentences, then one open question that keeps the conversation going.
- Never correct him and never comment on his English; corrections are shown to him separately. When he made a mistake, simply reuse the correct form naturally in your reply.
- If he writes a French word between [brackets], use the English equivalent naturally in your reply and put it in **bold**.
- From time to time, use one useful expression linked to his weak points and put it in **bold**.
- When you mention real cases, laws or facts, stay with well-established facts; never invent cases, rulings or quotes.
- Stay in English unless he explicitly asks for French. Plain text only, no lists, no emojis.
Your first message opens the conversation.`;
}
function startTalk(id){ if(canSpeak) speechSynthesis.cancel(); CHAT = { scenario:id, items:[], turns:[], started:Date.now(), sugg:[], cleanRun:0 }; saveChat(); renderTalk(); aiTurn(); }
function markWrong(text, an){
  let h = esc(text);
  if(an && an.errors) for(const e of an.errors){ const w = esc(e.wrong||""); if(!w) continue; h = h.replace(new RegExp(reEsc(w),"i"), m=>`<u>${m}</u>`); }
  return h;
}
function corrHTML(it){
  if(it.an==="pending") return `<span class="small muted">Correction en cours ${DOTS}</span>`;
  if(it.an==="error") return `<span class="err">Correction impossible. <button class="btn ghost small" data-act="reanalyze" data-i="${it.idx}">Réessayer</button></span>`;
  const a = it.an; if(!a || typeof a!=="object") return "";
  let h = "";
  if(!a.errors || !a.errors.length) h += `<span class="ok">✓ Rien à corriger <span class="xptag">+14 XP</span></span>`;
  else {
    h += a.errors.map(e=>`<div class="e"><s>${esc(e.wrong)}</s><span class="fix">→ ${esc(e.right)}</span><span class="why">${esc(e.why||"")} <span class="tag">${CATS[e.cat]||CATS.phrasing}</span></span></div>`).join("");
    if(a.corrected && norm(a.corrected)!==norm(it.text)) h += `<div><span class="small muted">Version corrigée :</span> <span class="full">${esc(a.corrected)}</span></div>`;
  }
  if(a.better && norm(a.better)!==norm(a.corrected||it.text)) h += `<div><span class="small muted">Plus naturel :</span> <span class="full" style="color:var(--biro)">${esc(a.better)}</span></div>`;
  if(a.words && a.words.length) h += `<div class="wordchips">${a.words.map(w=>`<span>${esc(w.fr)} → <b>${esc(w.en)}</b></span>`).join("")}</div>`;
  return h;
}
function itemHTML(it, i){
  it.idx = i;
  if(it.role==="ai") return `<div class="msg ai" id="b${i}"><div class="who">Partenaire ${canSpeak&&it.text?`<button class="spk" data-act="speak-msg" data-i="${i}" aria-label="Écouter">${ICON.spk}</button>`:""}</div><div class="txt">${it.text ? md(it.text) : DOTS}</div>${it.err?`<div class="err">${esc(it.err)} <button class="btn ghost small" data-act="ai-retry">Réessayer</button></div>`:""}</div>`;
  if(it.role==="me") return `<div class="msg me" id="b${i}"><div class="txt">${markWrong(it.text, it.an)}</div><div class="corr" id="c${i}">${corrHTML(it)}</div></div>`;
  if(it.role==="report") return `<div class="report" id="b${i}">${reportHTML(it)}</div>`;
  return "";
}
function reportHTML(it){
  if(it.state==="pending") return `<h3>Bilan de séance</h3><span class="small muted">Rédaction du bilan ${DOTS}</span>`;
  if(it.state==="error") return `<h3>Bilan de séance</h3><span class="err">${esc(it.err)} <button class="btn ghost small" data-act="talk-report">Réessayer</button></span>`;
  const r = it.data||{};
  return `<h3>Bilan de séance</h3><p>${esc(r.summary||"")}</p>
    ${r.strengths&&r.strengths.length?`<div><span class="label">Points forts</span><ul>${r.strengths.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`:""}
    ${r.priorities&&r.priorities.length?`<div><span class="label">À travailler</span><ul>${r.priorities.map(p=>`<li><b>${esc(CATS[p.cat]||p.cat||"")}</b> : ${esc(p.tip||"")}</li>`).join("")}</ul></div>`:""}
    ${r.phrases&&r.phrases.length?`<div><span class="label">Expressions à garder</span><ul>${r.phrases.map(p=>`<li class="hand" style="color:var(--biro);font-size:1.05rem">${esc(p)}</li>`).join("")}</ul></div>`:""}
    <div class="row"><button class="btn primary" data-act="talk-new">Nouvelle conversation</button><button class="btn" data-act="tab" data-tab="drill">Exercices sur ces erreurs</button></div>`;
}
function renderTalk(){
  const v = $("#v-talk");
  if(!CHAT.scenario){
    v.innerHTML = `<div class="stack" style="gap:6px"><h2>Choisis une situation</h2><p class="muted">L’IA te répond en anglais, au niveau ${lvName()}. Sous chaque phrase, la correction arrive au stylo rouge. Message sans faute : +14 XP ; avec fautes : +6 XP, et les fautes partent dans ton carnet.</p></div>
      <div class="scen">${SCEN.map(s=>`<button data-act="talk-start" data-id="${s.id}"><b>${s.t}</b><span>${s.d}</span></button>`).join("")}</div>
      <div class="notice">Pour parler au lieu de taper, utilise la dictée du clavier (le micro du clavier sur téléphone) réglée en anglais. Un mot te manque ? Écris-le en français entre crochets : <i>I want to [enchérir] on this lot</i>.</div>`;
    return;
  }
  const s = scen();
  v.innerHTML = `<div class="talk-head"><div><span class="label">Conversation · niveau ${lvName()}</span><h2>${s.t}</h2>${CHAT.cleanRun?`<span class="cleanrun">${CHAT.cleanRun} message${CHAT.cleanRun>1?"s":""} sans faute d’affilée</span>`:""}</div>
      <div class="row"><button class="btn" data-act="talk-report">Bilan <span class="xptag">+25 XP</span></button><button class="btn ghost" data-act="talk-new">Changer</button></div></div>
    <div class="sheet log" id="log">${CHAT.items.map(itemHTML).join("")}</div>
    <div class="composer">
      <div class="sugg" id="sugg">${(CHAT.sugg||[]).map((t,i)=>`<button data-act="use-sugg" data-i="${i}">${esc(t)}</button>`).join("")}</div>
      <div class="line"><textarea id="msg" rows="2" placeholder="Write in English… (un mot en français ? mets-le entre [crochets])" aria-label="Ton message">${esc(CHAT.draft||"")}</textarea>
      <button class="btn primary" data-act="talk-send" id="send">Envoyer</button></div>
      <div class="row small"><button class="btn ghost" data-act="talk-help" id="helpbtn">Idées de réponse</button>${photoBtn("talk","Photo")}<span class="muted">${coarse?"Astuce : dictée du clavier en anglais pour parler.":"Entrée pour envoyer, Maj+Entrée pour aller à la ligne."}</span></div>
    </div>`;
  const ta = $("#msg");
  ta.addEventListener("input", ()=>{ CHAT.draft = ta.value; clearTimeout(ta._t); ta._t = setTimeout(saveChat, 600); });
  ta.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey && !coarse){ e.preventDefault(); sendTalk(); } });
}
function renderLog(scroll=true){
  const log = $("#log"); if(!log) return;
  log.innerHTML = CHAT.items.map(itemHTML).join("");
  if(scroll){ const last = log.lastElementChild; if(last) last.scrollIntoView({block:"end", behavior: reduced?"auto":"smooth"}); }
}
function updateBubble(i){ const el = document.getElementById("b"+i); if(!el) return renderLog(false); const tmp = document.createElement("div"); tmp.innerHTML = itemHTML(CHAT.items[i], i); el.replaceWith(tmp.firstElementChild); }
async function aiTurn(){
  if(busy.talk) return; busy.talk = true;
  const it = {role:"ai", text:""}; CHAT.items.push(it); const i = CHAT.items.length-1; renderLog();
  const turns = CHAT.turns.slice(-24);
  try {
    const {text} = await ask([{role:"user",content:rules()}, ...turns], {modelTier:"quick", onText:({text})=>{ it.text = text; const el=document.querySelector("#b"+i+" .txt"); if(el) el.innerHTML = md(text); }});
    it.text = text; CHAT.turns.push({role:"assistant", content:text}); updateBubble(i); saveChat();
    if(P.voice.auto) speak(text);
  } catch(e){
    it.text = e.text || ""; it.err = errMsg(e) || "Interrompu.";
    if(it.text){ CHAT.turns.push({role:"assistant", content:it.text}); it.err = ""; }
    updateBubble(i); saveChat();
  } finally { busy.talk = false; }
}
function sendTalk(){
  const ta = $("#msg"); if(!ta) return; const text = ta.value.trim(); if(!text) return;
  if(busy.talk) return toast("Attends la fin de la réponse.");
  const lastAi = [...CHAT.items].reverse().find(x=>x.role==="ai");
  if(lastAi && lastAi.err){ CHAT.items.splice(CHAT.items.indexOf(lastAi),1); }
  if(canSpeak) speechSynthesis.cancel();
  const it = {role:"me", text, an:"pending", prev: lastAi ? lastAi.text : ""};
  CHAT.items.push(it); CHAT.turns.push({role:"user", content:text});
  CHAT.draft = ""; CHAT.sugg = []; ta.value = ""; $("#sugg").innerHTML = "";
  saveChat(); renderLog(); analyze(CHAT.items.length-1); aiTurn();
}
async function analyze(i){
  const it = CHAT.items[i]; const first = !it.scored; it.an = "pending"; updateCorr(i);
  const prompt = `You are an English teacher correcting a French-speaking learner (CEFR level ${lvName()}).
Context, the previous message from his conversation partner: """${(it.prev||"(none, he starts)").slice(0,1200)}"""
The learner wrote: """${it.text}"""
Find every real mistake (grammar, tenses, articles, prepositions, word order, vocabulary and false friends, spelling, agreement) and every phrasing a native speaker would not use. Ignore a missing final full stop and capitalisation of the first word. Words in French between [brackets] are not mistakes: translate them in "words".
Reply with only JSON in this shape:
{"corrected":"the whole message corrected, keeping his meaning and style","errors":[{"wrong":"the exact short fragment from his text","right":"the corrected fragment","why":"short explanation in simple French, one sentence","cat":"tense|article|prep|order|vocab|spelling|agreement|phrasing"}],"better":"a more natural way a native speaker would say it, or an empty string if his version is already natural","words":[{"fr":"French word from the brackets","en":"English equivalent","example":"short English example sentence"}]}
If there is no mistake, "errors" is an empty array and "corrected" repeats the message.`;
  try {
    const a = await askJSON(prompt, {modelTier:"default"});
    if(!a || typeof a!=="object" || Array.isArray(a)) throw {code:"invalid_json"};
    a.errors = Array.isArray(a.errors) ? a.errors.filter(e=>e && e.wrong && e.right) : [];
    a.words = Array.isArray(a.words) ? a.words.filter(w=>w && w.en && w.fr) : [];
    it.an = a;
    for(const e of a.errors) addError(e, {ctx:it.text, src:"conversation"});
    let nw = 0; for(const w of a.words) if(addWord(w, "conversation")) nw++;
    CHAT.errCount = (CHAT.errCount||0) + a.errors.length;
    if(first){
      it.scored = true; const clean = a.errors.length===0;
      CHAT.cleanRun = clean ? (CHAT.cleanRun||0)+1 : 0;
      if(clean) snd("ok");
      gain(clean ? 14 : 6); bump("msgs"); if(clean) bump("clean"); if(nw) bump("words", nw);
      adapt(clean ? 1 : Math.max(0, 1 - a.errors.length*0.3), 0.5);
      const h = document.querySelector(".cleanrun"); if(h) h.textContent = CHAT.cleanRun ? `${CHAT.cleanRun} message${CHAT.cleanRun>1?"s":""} sans faute d’affilée` : "";
    }
  } catch(e){ it.an = "error"; if(e && e.code!=="cancelled" && e.code!=="invalid_json") toast(errMsg(e)); }
  saveChat();
  const el = document.getElementById("b"+i); if(el){ el.querySelector(".txt").innerHTML = markWrong(it.text, it.an); }
  updateCorr(i);
}
function updateCorr(i){ const el = document.getElementById("c"+i); if(el){ CHAT.items[i].idx=i; el.innerHTML = corrHTML(CHAT.items[i]); } }
async function talkHelp(){
  if(busy.help) return; busy.help = true;
  const b = $("#helpbtn"); if(b){ b.disabled = true; b.innerHTML = "Idées "+DOTS; }
  const conv = CHAT.turns.slice(-6).map(t=>(t.role==="user"?"Noah: ":"Partner: ")+t.content).join("\n");
  try {
    const arr = await askJSON(`A French learner of English (CEFR ${lvName()}) is in this conversation:\n${conv}\n\nSuggest 3 different short replies he could write next, each natural, correct and at his level, with different ideas. Reply with only a JSON array of 3 strings.`, {modelTier:"quick"});
    CHAT.sugg = Array.isArray(arr) ? arr.map(String).slice(0,3) : []; saveChat();
    const s = $("#sugg"); if(s) s.innerHTML = CHAT.sugg.map((t,i)=>`<button data-act="use-sugg" data-i="${i}">${esc(t)}</button>`).join("");
  } catch(e){ const m = errMsg(e); if(m) toast(m); }
  busy.help = false; if(b){ b.disabled = false; b.textContent = "Idées de réponse"; }
}
async function talkReport(){
  const mine = CHAT.items.filter(x=>x.role==="me");
  if(mine.length < 2) return toast("Écris au moins deux messages avant de demander un bilan.");
  if(busy.report) return; busy.report = true;
  let it = CHAT.items.find(x=>x.role==="report" && x.state!=="done");
  const already = CHAT.items.some(x=>x.role==="report" && x.state==="done");
  if(!it){ it = {role:"report", state:"pending"}; CHAT.items.push(it); } else it.state = "pending";
  renderLog();
  const conv = CHAT.turns.map(t=>(t.role==="user"?"Noah: ":"Partner: ")+t.content).join("\n").slice(-12000);
  const errs = mine.flatMap(m => (m.an && m.an.errors) || []).map(e=>`${e.wrong} → ${e.right} (${e.cat})`).join("; ");
  try {
    const r = await askJSON(`Here is an English conversation between a conversation partner and Noah, a French learner of English (CEFR ${lvName()}), followed by the mistakes detected in his messages.\n\nCONVERSATION:\n${conv}\n\nMISTAKES: ${errs||"none"}\n\nWrite a short end-of-session report in French for Noah: encouraging but honest and concrete. Reply with only JSON: {"summary":"2 sentences in French","strengths":["2 short points in French"],"priorities":[{"cat":"tense|article|prep|order|vocab|spelling|agreement|phrasing","tip":"a concrete tip in French with one correct English example"}],"phrases":["3 useful English expressions from this conversation or that he could have used"]}`, {modelTier:"default"});
    it.state = "done"; it.data = r;
    if(!already){ gain(25); if(CHAT.scenario==="court") bump("court"); }
    logSession({type:"talk", title:scen().t, note:`${mine.length} messages · ${CHAT.errCount||0} erreurs relevées`});
  } catch(e){ it.state = "error"; it.err = errMsg(e) || "Interrompu."; }
  busy.report = false; saveChat(); renderLog();
}

/* ================= DICTATION ================= */
const dtok = s => String(s).trim().split(/\s+/).filter(Boolean);
const dkeyW = w => w.toLowerCase().replace(/[’‘`]/g,"'").replace(/^[^a-z0-9']+|[^a-z0-9']+$/gi,"").replace(/^'+|'+$/g,"");
function compare(target, typed){
  const A = dtok(target).filter(w=>dkeyW(w)), B = dtok(typed).filter(w=>dkeyW(w));
  const a = A.map(dkeyW), b = B.map(dkeyW), n = a.length, m = b.length;
  const D = Array.from({length:n+1}, (_,i)=>Array.from({length:m+1}, (_,j)=> i===0 ? j : j===0 ? i : 0));
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++) D[i][j] = Math.min(D[i-1][j]+1, D[i][j-1]+1, D[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  const ops = []; let i = n, j = m;
  while(i>0 || j>0){
    if(i>0 && j>0 && D[i][j] === D[i-1][j-1] + (a[i-1]===b[j-1]?0:1)){ ops.unshift(a[i-1]===b[j-1] ? {t:"eq",a:A[i-1]} : {t:"sub",a:A[i-1],b:B[j-1]}); i--; j--; }
    else if(i>0 && D[i][j] === D[i-1][j]+1){ ops.unshift({t:"del",a:A[i-1]}); i--; }
    else { ops.unshift({t:"ins",b:B[j-1]}); j--; }
  }
  const errs = ops.filter(o=>o.t!=="eq").length;
  return {ops, score: n ? Math.max(0, 1 - errs/n) : 0};
}
function diffHTML(ops){
  return ops.map(o => o.t==="eq" ? `<span class="ok">${esc(o.a)}</span>` : o.t==="sub" ? `<span class="bad"><s>${esc(o.b)}</s><b>${esc(o.a)}</b></span>` : o.t==="del" ? `<span class="miss" title="mot manquant">${esc(o.a)}</span>` : `<span class="extra"><s>${esc(o.b)}</s></span>`).join(" ");
}
async function dcGen(cid){
  if(busy.dict) return; busy.dict = true; renderDict();
  const topic = cid && courseById(cid) ? courseTopic(cid) : THEMES_EN[THEMES[Math.floor(Math.random()*(THEMES.length-1))]];
  if(cid) bump("course");
  try {
    const r = await askJSON(`Create a dictation for Noah, a French-speaking university student in law and art history, CEFR level ${lvName()} (${lvDesc()}).
Write 6 sentences of ${DICT_LEN[BAND(P.dlv)]} words each, forming a short coherent mini-story or mini-article about: ${topic}.
Include listening traps that French speakers often miss: homophones (their/there/they're, its/it's, whose/who's, to/too/two), silent letters, -ed endings, plural -s, contractions and weak forms. ${weakLine()}
Only well-established facts if you mention real cases or people; otherwise fiction is fine.
Reply with only JSON: {"title":"short English title","items":[{"text":"the sentence","tip":"in French, one short tip about the trickiest spot for a listener"}]}`, {modelTier:"default"});
    if(!r || !Array.isArray(r.items) || !r.items.length) throw {code:"invalid_json"};
    DC = {set:{title:r.title||"Dictée", items:r.items.filter(x=>x && x.text).slice(0,8)}, i:0, typed:"", res:[], plays:0, done:false, ai:true}; saveDc();
    setTimeout(()=>speak(DC.set.items[0].text), 300);
  } catch(e){ const m = errMsg(e); if(m) toast(m + " Lance une dictée express en attendant."); }
  busy.dict = false; renderDict();
}
function dcExpress(){
  const bank = DICT_BANK[BAND(P.dlv)].slice(); for(let i=bank.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [bank[i],bank[j]] = [bank[j],bank[i]]; }
  DC = {set:{title:"Dictée express · "+lvName(), items:bank.map(t=>({text:t, tip:""}))}, i:0, typed:"", res:[], plays:0, done:false, ai:false}; saveDc(); renderDict();
  setTimeout(()=>speak(DC.set.items[0].text), 300);
}
function dcScore(i, typed){
  const it = DC.set.items[i]; const r = compare(it.text, typed);
  DC.res[i] = {score:r.score, ops:r.ops, typed, plays:DC.plays};
  let xp = Math.round(r.score*14) + (r.score===1 ? 8 : 0); if(!DC.paper && DC.plays <= 1 && r.score===1) xp += 4;
  if(r.score===1) bump("dictok");
  let added = 0;
  for(const o of r.ops){ if(o.t==="sub" && added < 3){ const right = o.a.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g,""); const wrong = o.b.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g,"");
      if(addError({wrong, right, why:"Dictée : mot mal entendu ou mal orthographié.", cat:"spelling"}, {ctx:it.text, src:"dictée"})) added++; } }
  return xp;
}
function dcCheck(){
  const typed = (DC.typed||"").trim();
  if(!typed) return toast("Écris ce que tu entends.");
  const xp = dcScore(DC.i, typed); gain(xp); snd(DC.res[DC.i].score===1 ? "ok" : "bad");
  saveDc(); renderDict(); renderStats();
}
function dcPaperGrade(arr){
  let xp = 0; DC.set.items.forEach((_,i)=>{ xp += dcScore(i, String(arr[i]||"").trim()); });
  gain(xp); dcFinish(); saveDc(); renderDict(); renderStats();
}
function dcNext(){
  DC.i++; DC.typed = ""; DC.plays = 0;
  if(DC.i >= DC.set.items.length) dcFinish(); else setTimeout(()=>speak(DC.set.items[DC.i].text), 250);
  saveDc(); renderDict();
}
function dcFinish(){
  {
    DC.done = true; DC.paper = false; const avg = DC.res.reduce((a,b)=>a+(b?b.score:0),0)/DC.set.items.length;
    bump("dict"); if(DC.res.every(x=>x && x.score===1)) bump("dictPerfect");
    adapt(avg, 1.2);
    if(avg >= 0.9){ stamp("Adjugé !", Math.round(avg*100)+" % à la dictée"); confetti(); snd("up"); gain(20); }
    logSession({type:"dict", title:DC.set.title, note:Math.round(avg*100)+" % de mots justes"});
  }
}

  }
  if(c.ctx && norm(c.ctx).includes(norm(c.wrong)) && norm(c.ctx)!==norm(c.wrong)){
    const q = esc(c.ctx).replace(new RegExp(reEsc(esc(c.wrong)),"i"), m=>`<u>${m}</u>`);
    return `<span class="label">Erreur · ${CATS[c.cat]||""} · corrige le passage souligné</span><div class="q">${q}</div>`;

function rvCheck(){
  const c = cardById(RV.queue[RV.i]); if(!c) return;
  const t = norm(RV.typed); if(!t) return rvGiveUp();
  const target = c.kind==="word" ? norm(c.en).replace(/^to /,"") : norm(c.right);
  RV.correct = c.kind==="word" ? (t.replace(/^to /,"")===target) : (t===target);
  snd(RV.correct ? "ok" : "bad"); RV.phase = "show"; renderReview();
}
function rvGiveUp(){ RV.correct = false; RV.phase = "show"; renderReview(); }

async function exGrade(){
  if(busy.grade || !EX.set) return;
  const items = EX.set.items.map((it,i)=>({i, instruction:it.instruction, prompt:it.prompt, model:it.answer, learner:(EX.answers[i]||"").trim()}));
  if(items.every(x=>!x.learner)) return toast("Réponds d’abord à au moins un exercice.");
  busy.grade = true; renderDrill();
  try {
    const r = await askJSON(`Grade the answers of a French-speaking learner of English (CEFR ${lvName()}). Accept any answer that is correct and natural even if it differs from the model answer. Ignore capitalisation and the final punctuation. An empty answer is wrong.

    EX.results = Array.isArray(r.results) ? r.results : [];

    for(const res of EX.results){ const it = EX.set.items[Number(res.i)]; if(!it) continue; if(res.correct){ good++; continue; }
      addError({wrong:(EX.answers[res.i]||"").trim()||"(sans réponse)", right:res.fixed||it.answer, why:res.feedback, cat:it.cat}, {ctx:`${it.instruction} : ${it.prompt}`, src:"exercice"}); }
    const n = EX.set.items.length;

    if(good===n) { stamp("Sans-faute", good+"/"+n); snd("up"); } else snd(good/n>=0.6?"ok":"bad");
    if(EX.boss){
      if(good >= Math.ceil(n*0.8)){ P.boss = {week:weekKey(), beaten:true}; bump("boss"); gain(150); stamp("Boss vaincu", good+"/"+n); confetti(); snd("up"); }

function shuffle(a, r=Math.random){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

/* ----- cloze ----- */
function clFromBank(c){ return {title:c.t, text:c.text, level:LV[c.b*2], blanks:c.bl.map(([a,cat,why],i)=>({n:i+1, answers:a, cat, why}))}; }
function clStart(set, src){ CL = {set, answers:[], results:null, wb:CL.wb, last:src||CL.last}; saveCl(); renderCloze(); }
function clBank(){
  const band = BAND(P.dlv);
  let pool = CLOZE_BANK.filter(c=>c.b===band && c.t!==CL.last);
  if(!pool.length) pool = CLOZE_BANK.filter(c=>Math.abs(c.b-band)<=1 && c.t!==CL.last);
  const c = pool[Math.floor(Math.random()*pool.length)]; clStart(clFromBank(c), c.t);
}
async function clGen(cid){
  if(busy.cloze) return; busy.cloze = true; renderCloze();
  const band = BAND(P.dlv); const topic = cid && courseById(cid) ? courseTopic(cid) : THEMES_EN[THEMES[Math.floor(Math.random()*(THEMES.length-1))]];
  if(cid) bump("course");
  try {
    const r = await askJSON(`Create a gap-fill text for Noah, a French-speaking university student in law and art history, CEFR ${lvName()} (${lvDesc()}). Subject: ${topic}. Length: about ${[120,170,220,270,320][band]} words, with 10 blanks.
Mark each blank in the text as [1], [2], … in order. When the blank needs a word to transform (verb tense, comparative, word family), put the base word in brackets right after the blank, e.g. "Last year she [3] (go) to London". For prepositions, articles, connectors and pronouns, give no hint.
Target his weak points: ${weakLine() || "tenses, prepositions, articles and false friends"}. Each blank must have one clearly correct answer; list every acceptable variant.
Only well-established facts about real cases or people; otherwise fiction is fine.
Reply with only JSON: {"title":"","text":"the text with [n] markers, paragraphs separated by a blank line","blanks":[{"n":1,"answers":["accepted answer","variant"],"why":"short French explanation of the rule","cat":"tense|article|prep|order|vocab|spelling|agreement|phrasing"}]}`, {modelTier:"default"});
    if(!r || !r.text || !Array.isArray(r.blanks)) throw {code:"invalid_json"};
    const marks = (r.text.match(/\[(\d+)\]/g)||[]).length;
    const blanks = r.blanks.filter(b=>b && Array.isArray(b.answers) && b.answers.length).sort((a,b)=>a.n-b.n).slice(0, marks).map((b,i)=>({n:i+1, answers:b.answers.map(String), why:String(b.why||""), cat:CATS[b.cat]?b.cat:"phrasing"}));
    if(!blanks.length) throw {code:"invalid_json"};
    clStart({title:r.title||"Gap-fill", text:r.text, level:lvName(), blanks}, "");
  } catch(e){ const m = errMsg(e); if(m) toast(m + " Prends un texte de la bibliothèque en attendant."); }
  busy.cloze = false; renderCloze();
}
function clSentence(s, i){
  const parts = s.text.split(/(?<=[.!?])\s+/); const tag = "["+(i+1)+"]";
  const sent = parts.find(p=>p.includes(tag)) || "";
  return sent.replace(/\[(\d+)\]/g, (m,n) => Number(n)===i+1 ? "___" : (s.blanks[n-1] ? s.blanks[n-1].answers[0] : "___")).slice(0,260);
}
function clGrade(){
  if(!CL.set || CL.results) return;
  const s = CL.set;
  if(!s.blanks.some((_,i)=>(CL.answers[i]||"").trim())) return toast("Remplis au moins un blanc.");
  CL.results = s.blanks.map((b,i)=>{ const u = (CL.answers[i]||"").trim(); return {user:u, ok: !!u && b.answers.some(a=>norm(a)===norm(u))}; });
  const n = s.blanks.length, good = CL.results.filter(r=>r.ok).length;
  CL.results.forEach((r,i)=>{ if(!r.ok && r.user){ const b = s.blanks[i]; addError({wrong:r.user||"(vide)", right:b.answers[0], why:b.why||"Texte à trous", cat:b.cat}, {ctx:clSentence(s,i), src:"exercice"}); } });
  gain(good*6 + (good===n ? 25 : 0)); bump("cloze"); bump("exok", good); adapt(good/n, 1.2);
  if(good===n){ stamp("Sans-faute", good+"/"+n); confetti(); snd("up"); } else snd(good/n>=0.6 ? "ok" : "bad");
  logSession({type:"drill", title:"Texte à trous : "+s.title, note:`${good}/${n} justes`});
  saveCl(); renderCloze(); renderStats();
}
function renderCloze(){
  const v = $("#v-drill");
  const nb = CLOZE_BANK.filter(c=>c.b===BAND(P.dlv)).length;
  const head = `<div class="stack" style="gap:8px"><h2>Exercices</h2>${modeBar()}<p class="muted">Complète chaque blanc. Le mot entre parenthèses est la base à transformer (temps, comparatif, famille de mots) ; sans parenthèses, c’est une préposition, un article ou un connecteur. 6 XP par blanc juste, 25 de bonus pour un sans-faute.</p></div>
    <div class="row"><button class="btn primary" data-act="cl-gen" ${busy.cloze?"disabled":""}>${busy.cloze?"Écriture du texte "+DOTS:"Nouveau texte à trous (IA)"}</button><button class="btn" data-act="cl-bank">Bibliothèque (${CLOZE_BANK.length} textes, ${nb} à ton niveau)</button><button class="chip" data-act="cl-wb" aria-pressed="${!!CL.wb}">Banque de mots</button></div>`;
  if(!CL.set){ v.innerHTML = head + `<div class="sheet stack"><span class="label">Exemple</span><p class="article" style="font-size:1.05rem">Last Sunday, we <span class="bn">1</span><input class="blank" style="width:6ch" disabled aria-label="exemple"> (see) a painting by Monet.</p><p class="small muted">Réponse : saw.</p>${paperHint()}</div>`; return; }
  const s = CL.set, res = CL.results, n = s.blanks.length;
  const good = res ? res.filter(r=>r.ok).length : 0;
  const bank = CL.wb ? shuffle(s.blanks.map(b=>b.answers[0]), rng(hash(s.title))) : null;
  let html = esc(s.text).replace(/\[(\d+)\]/g, (m, num) => {
    const i = Number(num)-1, b = s.blanks[i]; if(!b) return m; const r = res && res[i];
    const w = Math.max(5, (b.answers[0]||"").length + 2);
    return `<span class="bn">${num}</span><input class="blank ${r?(r.ok?"good":"bad"):""}" id="bl-${i}" data-i="${i}" style="width:${w}ch" ${res?"readonly":""} autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(CL.answers[i]||"")}" aria-label="Blanc ${num}">${r&&!r.ok?`<span class="fixin">${esc(b.answers[0])}</span>`:""}`;
  });
  html = html.split(/\n\s*\n/).map(p=>`<p>${p}</p>`).join("");
  v.innerHTML = head + `<div class="sheet stack"><div class="row between"><h3>${esc(s.title)}</h3>${res?`<span class="hand" style="font-size:1.3rem">${good}/${n}</span>`:`<span class="small muted">${n} blancs · niveau ${esc(s.level||lvName())}</span>`}</div>
    ${bank?`<div class="wbank">${bank.map(w=>`<span>${esc(w)}</span>`).join("")}</div>`:""}
    <div class="article">${html}</div>
    ${res ? `<div class="stack" style="gap:6px">${s.blanks.map((b,i)=>res[i].ok?"":`<div class="small"><b>${i+1}.</b> <s class="muted">${esc(res[i].user||"(vide)")}</s> → <span class="hand">${esc(b.answers.join(" / "))}</span>${b.why?` <span class="muted">· ${esc(b.why)}</span>`:""}</div>`).join("")}</div>
      <div class="row"><button class="btn primary" data-act="cl-gen">Nouveau texte (IA)</button><button class="btn" data-act="cl-bank">Bibliothèque</button>${canSpeak?`<button class="btn" data-act="cl-speak">${ICON.spk} Écouter le texte complet</button>`:""}</div>`
    : `<div class="row"><button class="btn primary" data-act="cl-grade">Corriger</button>${photoBtn("cloze")}</div>${paperHint()}`}</div>`;
  v.querySelectorAll("input.blank[data-i]").forEach(inp => inp.addEventListener("input", () => { CL.answers[Number(inp.dataset.i)] = inp.value; clearTimeout(inp._t); inp._t = setTimeout(saveCl, 400); }));
}

/* ----- QCM & placement test ----- */
function qzStart(items, title, test){ QZ = {set:{title, items}, i:0, picks:[], done:false, paper:false, test:!!test, combo:0, result:""}; saveQz(); renderQuiz(EX.mode); }
function shufOpts(it){ const idx = shuffle([0,1,2,3]); return Object.assign({}, it, {o:idx.map(j=>it.o[j]), a:idx.indexOf(it.a)}); }
function qzBank(){ const band = BAND(P.dlv); qzStart(shuffle(QBANK.filter(q=>q.b===band)).map(shufOpts), "QCM · niveau "+LV[band*2], false); }
function qzTest(){ const items = []; for(let b=0;b<5;b++) items.push(...shuffle(QBANK.filter(q=>q.b===b)).slice(0,4).map(shufOpts)); qzStart(items, "Test de niveau", true); }
async function qzGen(cid){
  if(busy.qz) return; busy.qz = true; renderQuiz(EX.mode);
  try {
    const r = await askJSON(`Create a 10-question multiple-choice quiz in English for Noah, a French-speaking university student in law and art history, CEFR ${lvName()} (${lvDesc()}). Mix grammar (tenses, prepositions, articles, word order, conditionals, passive), vocabulary and false friends for French speakers, and some legal and art-market English. ${cid && courseById(cid) ? "Base every question on his course: " + courseTopic(cid) : "Focus on: " + focusDesc("auto") + "."} Each question is one sentence with a blank ___ or a short question, with 4 options and exactly one correct answer; distractors should be typical mistakes of French speakers.
Reply with only JSON: {"title":"short English title","items":[{"q":"","options":["","","",""],"answer":0,"why":"short French explanation","cat":"tense|article|prep|order|vocab|spelling|agreement|phrasing"}]}`, {modelTier:"default"});
    const items = (r && Array.isArray(r.items) ? r.items : []).filter(x=>x && x.q && Array.isArray(x.options) && x.options.length===4 && Number(x.answer)>=0 && Number(x.answer)<=3)
      .map(x=>({q:String(x.q), o:x.options.map(String), a:Number(x.answer), why:String(x.why||""), cat:CATS[x.cat]?x.cat:"phrasing"}));
    if(!items.length) throw {code:"invalid_json"};
    busy.qz = false; if(cid) bump("course"); qzStart(items.slice(0,12), r.title||"QCM", false);
  } catch(e){ const m = errMsg(e); if(m) toast(m + " Prends un QCM de la bibliothèque en attendant."); }
  busy.qz = false; renderQuiz(EX.mode);
}
function qzPick(k){
  if(!QZ.set || QZ.done) return; const it = QZ.set.items[QZ.i]; if(QZ.picks[QZ.i] != null) return;
  QZ.picks[QZ.i] = k;
  if(QZ.test){ saveQz(); return qzNext(); }
  if(k===it.a){ QZ.combo = (QZ.combo||0)+1; gain(5 + Math.min(QZ.combo,10)); bump("qcmok"); snd("ok"); }
  else { QZ.combo = 0; snd("bad"); addError({wrong:it.o[k], right:it.o[it.a], why:it.why, cat:it.cat}, {ctx:it.q, src:"exercice"}); }
  saveQz(); renderQuiz(EX.mode); renderStats();
}
function qzNext(){ QZ.i++; if(QZ.i >= QZ.set.items.length) qzFinish(); saveQz(); renderQuiz(EX.mode); }
function qzFinish(){
  QZ.done = true; QZ.paper = false;
  const items = QZ.set.items, n = items.length, good = items.filter((it,i)=>QZ.picks[i]===it.a).length;
  if(QZ.test){
    const c = [0,0,0,0,0]; items.forEach((it,i)=>{ if(QZ.picks[i]===it.a) c[it.b]++; });
    let L = -1; for(let b=0;b<5;b++){ if(c[b]>=3) L = b; else break; }
    const d = L<0 ? 0 : Math.min(8, L*2 + (c[L]===4 && L<4 ? 1 : 0));
    items.forEach((it,i)=>{ const p = QZ.picks[i]; if(p!=null && p!==it.a) addError({wrong:it.o[p], right:it.o[it.a], why:it.why, cat:it.cat}, {ctx:it.q, src:"exercice"}); });
    P.dlv = d; P.dp = 30; P.lock = false; P.level = LV[d].replace("+","");
    P.placed = `${LV[d]} (${good}/${n}, le ${new Date().toLocaleDateString("fr-FR")})`;
    QZ.result = `Niveau estimé : ${LV[d]}. Détail : A2 ${c[0]}/4 · B1 ${c[1]}/4 · B2 ${c[2]}/4 · C1 ${c[3]}/4 · C2 ${c[4]}/4. Toute l’appli est réglée sur ce niveau.`;
    bump("test"); gain(40); stamp("Niveau "+LV[d], "Test de niveau"); confetti(); snd("up");
  } else {
    adapt(good/n, 1); bump("qcm");
    if(good===n){ gain(25); stamp("Sans-faute", good+"/"+n); confetti(); snd("up"); }
  }
  logSession({type:"drill", title:QZ.set.title, note:`${good}/${n} justes`}); Store.saveProfile(); renderStats();
}
function qzPaperGrade(arr){
  let xp = 0;
  QZ.set.items.forEach((it,i)=>{ const k = "ABCD".indexOf((arr[i]||"").trim().toUpperCase().charAt(0)); QZ.picks[i] = k>=0 ? k : null;
    if(k===it.a){ xp += 5; bump("qcmok"); } else if(k>=0) addError({wrong:it.o[k], right:it.o[it.a], why:it.why, cat:it.cat}, {ctx:it.q, src:"exercice"}); });
  gain(xp); qzFinish(); saveQz(); renderQuiz(EX.mode);
}

      <div class="stack" style="gap:10px">${QZ.set.items.map((it,i)=>{ const p = QZ.picks[i], ok = p===it.a;

    return;

  if(QZ.paper){
    v.innerHTML = head + `<div class="sheet stack"><div class="row between"><h3>${esc(QZ.set.title)}</h3><button class="btn ghost small" data-act="qz-paper">Revenir à l’écran</button></div>
      <p class="small muted">Sur ta feuille, écris le numéro de chaque question et la lettre choisie (par exemple « 1 B »), puis prends la feuille en photo.</p>
      <ol class="stack" style="gap:12px;padding-left:22px;margin:0">${QZ.set.items.map(it=>`<li><div>${esc(it.q)}</div><div class="small muted">${it.o.map((o,k)=>`<b>${"ABCD"[k]}</b> ${esc(o)}`).join(" · ")}</div></li>`).join("")}</ol>
      <div class="row">${photoBtn("qcm","Photographier ma feuille")}</div></div>`;
    return;

    <div class="bar pen"><i style="width:${i/n*100}%"></i></div>
    <div class="card"><div class="q">${esc(it.q)}</div>
      <div class="qopts">${it.o.map((o,k)=>`<button class="qopt ${shown?(k===it.a?"right":k===p?"wrong":""):""}" data-act="qz-pick" data-k="${k}" ${shown?"disabled":""}><b>${"ABCD"[k]}</b><span>${esc(o)}</span></button>`).join("")}</div>
      ${shown?`<p>${p===it.a?`<span class="hand" style="color:var(--ok);font-size:1.2rem">✓ Exact</span>`:`<span class="hand" style="font-size:1.2rem">→ ${esc(it.o[it.a])}</span>`} <span class="muted">${esc(it.why||"")}</span></p><div><button class="btn primary" data-act="qz-next" id="qz-next">${i+1<n?"Question suivante":"Voir le résultat"}</button></div>`:""}

/* ================= QUICK QUESTIONS (express) ================= */
let QK = lsGet("rpe:quick") || {ai:[], recent:[], run:0};
if(!Array.isArray(QK.ai)) QK.ai = []; if(!Array.isArray(QK.recent)) QK.recent = [];
const saveQk = () => lsSet("rpe:quick", {ai:QK.ai.slice(0,60), recent:QK.recent.slice(-40), run:QK.run||0});
const QKS = {cur:null, curScope:undefined, phase:"ask", typed:"", picked:[], pick:null, ok:null, scope:null, session:0, el:null};
const courseById = id => S.courses.find(c=>c.id===id);
function allTerms(cid){ const cs = cid ? S.courses.filter(c=>c.id===cid) : S.courses; return cs.flatMap(c=>(c.terms||[]).map(t=>Object.assign({cid:c.id, ctitle:c.title}, t))); }
function quickPool(scope){
  const band = BAND(P.dlv), pool = [];
  const add = (id, w, make) => pool.push({id, w, make});
  const terms = allTerms(scope);
  terms.forEach(t => {
    add("tfr:"+t.en, 3, () => ({kind:"type", label:"Terme de ton cours", prompt:`${t.fr}`, sub:`Comment dit-on en anglais ? · ${t.ctitle}`, answers:[t.en], why:t.def||"", cat:"vocab", term:t}));
    if(t.example && new RegExp("\\b"+reEsc(t.en)+"\\b","i").test(t.example))
      add("tex:"+t.en, 2, () => ({kind:"type", label:"Complète avec un terme du cours", prompt:t.example.replace(new RegExp("\\b"+reEsc(t.en)+"\\b","i"), "___"), sub:`Indice : ${t.fr}`, answers:[t.en], why:t.def||"", cat:"vocab", term:t}));
    if(canSpeak) add("tls:"+t.en, 1, () => ({kind:"listen", label:"Écoute et écris le terme", say:t.en, answers:[t.en], why:`${t.en} = ${t.fr}`, cat:"spelling", term:t}));
  });
  if(terms.length >= 4) terms.forEach(t => { if(t.def) add("tdf:"+t.en, 2, () => { const others = shuffle(terms.filter(x=>x.en!==t.en)).slice(0,3).map(x=>x.en); const o = shuffle([t.en, ...others]);
    return {kind:"mcq", label:"Quel terme correspond ?", prompt:t.def, o, a:o.indexOf(t.en), why:`${t.en} = ${t.fr}`, cat:"vocab", term:t}; }); });
  terms.forEach(t => { if(t.example && wc(t.example) >= 4 && wc(t.example) <= 13) add("tor:"+t.en, 1, () => ({kind:"order", label:"Remets la phrase dans l’ordre", answer:t.example, words:shuffle(dtok(t.example)), why:"", cat:"order"})); });
  QK.ai.filter(x => scope ? x.cid===scope : !x.cid || Math.random()<0.5).forEach(x => add(x.id, 3, () => x));
  if(!scope){
    QBANK.filter(q=>q.b===band || q.b===band-1).forEach(q => add("qb:"+q.q, 2, () => Object.assign({kind:"mcq", label:"Choisis la bonne réponse", prompt:q.q}, shufOpts(q))));
    CLOZE_BANK.filter(c=>c.b===band || c.b===band-1).forEach(c => { const set = clFromBank(c); set.blanks.forEach((b,i) => add("cb:"+c.t+i, 2, () => ({kind:"type", label:"Complète", prompt:clSentence(set,i), answers:b.answers, why:b.why, cat:b.cat}))); });
    S.cards.forEach(c => { const due = (c.due||0) <= Date.now();
      if(c.kind==="word") add("cw:"+c.id, due?4:1, () => ({kind:"type", label:"Traduis en anglais", prompt:c.fr, answers:[c.en], why:c.example||"", cat:"vocab", cardId:c.id}));
      else if(c.wrong && c.wrong.length <= 70 && c.src!=="dictée" && c.wrong!=="(sans réponse)" && c.wrong!=="(vide)") add("ce:"+c.id, due?4:1, () => ({kind:"type", label:"Corrige l’erreur", prompt:c.wrong, sub:c.why?"":"", answers:[c.right], why:c.why||"", cat:c.cat, cardId:c.id}));
      else if(c.src==="dictée" && c.ctx && canSpeak) add("cd:"+c.id, due?3:1, () => ({kind:"listen", label:"Écoute et écris ce mot", say:c.right, answers:[c.right], why:"Mot raté en dictée.", cat:"spelling", cardId:c.id})); });

function qkCheck(k){

  else if(it.kind === "order"){ if(QKS.picked.length < it.words.length) return toast("Place tous les mots."); user = QKS.picked.map(i=>it.words[i]).join(" "); ok = norm(user) === norm(it.answer); }

  QK.recent.push(it.id); if(String(it.id).startsWith("ai:")) QK.ai = QK.ai.filter(x=>x.id!==it.id);

}

  const src = EXM.cfg.src && courseById(EXM.cfg.src) ? EXM.cfg.src : ""; const lang = EXM.cfg.lang || "fr"; const band = BAND(P.dlv);
  const n = [450,600,750,900,1000][band]; const er = [[100,150],[150,200],[180,250],[220,300],[250,350]][band];
  try {
    const r = await askJSON(`Create a mock university English exam for Noah, a French student in law and art history, CEFR ${lvName()} (${lvDesc()}).
Part 1, reading comprehension: an original text of about ${n} words in the style of a quality press article or an academic text, on ${src ? courseTopic(src) : "a topic related to law, the art market, culture or society"}. Only state well-established facts about real cases, laws or people; never invent rulings, figures or quotes. Then 6 comprehension questions written in ${lang==="fr" ? "French (he will answer in French)" : "English (he will answer in English)"}: 2 on explicit information, 2 on inference or the author's position, 1 on vocabulary in context, 1 asking for a short summary. Give each question its points, for a total of 10, and a model answer in the same language as the question.
Part 2, written expression: one essay subject in English linked to the text, ${er[0]} to ${er[1]} words.
Reply with only JSON: {"title":"","text":"paragraphs separated by a blank line","questions":[{"q":"","points":2,"model":""}],"essay":{"subject":"","min":${er[0]},"max":${er[1]}}}`, {modelTier:"default"});
    if(!r || !r.text || !Array.isArray(r.questions) || !r.questions.length || !r.essay) throw {code:"invalid_json"};
    let qs = r.questions.filter(q=>q && q.q).map(q=>({q:String(q.q), points:Math.max(0.5, Number(q.points)||1), model:String(q.model||"")}));
    const sum = qs.reduce((a,q)=>a+q.points,0); if(Math.abs(sum-10) > 0.01) qs = qs.map(q=>Object.assign(q,{points:half(q.points*10/sum)||0.5}));
    EXM = {cfg:EXM.cfg, set:{title:String(r.title||"Examen blanc"), text:String(r.text), questions:qs, essay:{subject:String(r.essay.subject||""), min:Number(r.essay.min)||er[0], max:Number(r.essay.max)||er[1]}, level:lvName(), src, lang}, ans:[], essay:"", fb:null};
    saveExm(); CR.view = "exam"; if(src) bump("course");
  } catch(e){ const m = errMsg(e); if(m) toast(m); }
  busy.exam = false; if(S.tab === "courses") renderCourses();
}
async function examGrade(){
  const e = EXM.set; if(!e || busy.exam || EXM.fb) return;
  const answers = e.questions.map((_,i)=>(EXM.ans[i]||"").trim());
  if(!answers.some(Boolean) && wc(EXM.essay) < 30) return toast("Réponds à au moins une partie avant de rendre ta copie.");
  busy.exam = true; renderExam();
  try {
    const r = await askJSON(`Grade this mock exam fairly and precisely, like a French university English teacher, for a CEFR ${e.level} student.
TEXT: """${e.text.slice(0,9000)}"""
PART 1 questions, with points and model answers: ${JSON.stringify(e.questions)}
His answers (expected in ${e.lang==="fr"?"French":"English"}): ${JSON.stringify(answers)}
PART 2 subject: "${e.essay.subject}" (${e.essay.min} to ${e.essay.max} words). His essay (${wc(EXM.essay)} words): """${EXM.essay}"""
Part 1: give each answer a score between 0 and its points (half points allowed) and a short comment in French; ${e.lang==="fr" ? "judge comprehension only, not his French" : "judge comprehension first; do not penalise small English mistakes here"}. An empty answer scores 0.
Part 2: grade with four criteria: task (respect of the subject and of the length) out of 2, argument (ideas, organisation, connectors) out of 3, vocabulary (range and precision) out of 2.5, grammar (accuracy) out of 2.5. An empty essay scores 0. List his main English mistakes.
Reply with only JSON: {"part1":[{"i":0,"score":1.5,"comment":"in French"}],"part2":{"task":0,"argument":0,"vocabulary":0,"grammar":0,"comment":"in French, 2 or 3 sentences","errors":[{"wrong":"exact fragment","right":"correction","why":"short French explanation","cat":"tense|article|prep|order|vocab|spelling|agreement|phrasing"}],"model":"a short model essay in English"},"advice":"2 sentences in French: what to work on before the real exam"}`, {modelTier:"default"});
    if(!r || !Array.isArray(r.part1) || !r.part2) throw {code:"invalid_json"};
    const p1s = e.questions.map((q,i)=>{ const x = r.part1.find(y=>Number(y.i)===i) || {}; return {score:Math.max(0,Math.min(q.points, half(Number(x.score)||0))), comment:String(x.comment||"")}; });
    const lim = {task:2, argument:3, vocabulary:2.5, grammar:2.5}; const p2 = r.part2;
    for(const k in lim) p2[k] = Math.max(0, Math.min(lim[k], half(Number(p2[k])||0)));
    p2.errors = Array.isArray(p2.errors) ? p2.errors.filter(x=>x&&x.wrong&&x.right) : [];
    const t1 = half(p1s.reduce((a,x)=>a+x.score,0)), t2 = half(p2.task+p2.argument+p2.vocabulary+p2.grammar), total = half(t1+t2);
    EXM.fb = {p1s, p2, t1, t2, total, advice:String(r.advice||"")};
    for(const x of p2.errors) addError(x, {ctx:EXM.essay.slice(0,300), src:"lecture"});
    gain(Math.round(total*5) + 20); bump("exam"); adapt(total/20, 2);
    if(total > (P.bestExam||0)) P.bestExam = total;
    logSession({type:"exam", title:e.title, note:`${total}/20`});
    if(total >= 14){ stamp(total >= 16 ? "Très bien" : "Mention", total+"/20"); confetti(); snd("up"); } else snd(total >= 10 ? "ok" : "bad");
    saveExm(); Store.saveProfile(); renderStats();
  } catch(err){ const m = errMsg(err); if(m) toast(m); }
  busy.exam = false; renderExam();
}

      reg.addEventListener("updatefound", () => {
        const w = reg.installing;
        w && w.addEventListener("statechange", () => { if(w.state === "installed" && navigator.serviceWorker.controller) toast("Nouvelle version disponible : ferme et rouvre l’appli.", 6000); });
      });
    }).catch(e => console.warn(e));
  }
})();
</script>
